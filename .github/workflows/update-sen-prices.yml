name: Update SEN fuel prices

on:
  workflow_dispatch:
  schedule:
    # Dos comprobaciones diarias. Si SEN cambia el horario de publicación,
    # OAVIX no depende de una única hora exacta.
    - cron: '0 6,18 * * *'

permissions:
  contents: write

concurrency:
  group: sen-price-update
  cancel-in-progress: true

jobs:
  update-sen-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Extract and validate official SEN prices
        run: node scripts/update-sen-prices.mjs

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sen-prices.json
          if git diff --cached --quiet; then
            echo "No SEN price changes detected."
          else
            git commit -m "data(sen): update official fuel prices"
            git push
          fi
