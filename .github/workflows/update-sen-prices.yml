name: Update SEN fuel prices

on:
  workflow_dispatch:
  schedule:
    # La SEN aplica la nueva estructura semanal los lunes a las 6:00 a. m.
    - cron: '30 13,16 * * 1'
    - cron: '30 13 * * 2'

permissions:
  contents: write

concurrency:
  group: update-sen-fuel-prices
  cancel-in-progress: false

jobs:
  update-sen-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read and validate official SEN prices
        run: node scripts/update-sen-prices.mjs

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sen-prices.json
          if git diff --cached --quiet; then
            echo "No SEN price changes detected."
          else
            git commit -m "data(sen): update official fuel prices"
            git push
          fi
