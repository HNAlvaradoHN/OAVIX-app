<div id="subtab-calendar" class="hidden space-y-3">
      <div class="animated-glass-card rounded-2xl p-4 sm:p-5 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeMonth(-1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
          <h3 id="calendar-month-year" class="text-base sm:text-lg font-black capitalize"></h3>
          <button onclick="changeMonth(1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center font-extrabold text-[11px] mb-2 opacity-80">
          <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-1.5"></div>
      </div>
    </div>
