<div id="subtab-records" class="hidden space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 border-b border-slate-800 pb-3 mb-2">
        <h3 class="font-black text-sm flex items-center space-x-2">
          <i class="fa-solid fa-list-check text-cyan-400"></i>
          <span>Historial Técnico de Servicios</span>
        </h3>
        <button id="maintenance-new-button" type="button" onclick="startNewMaintenance()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 text-white font-black text-xs shadow-lg shadow-cyan-600/30 transition flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-plus"></i><span>Nuevo Mantenimiento</span>
        </button>
      </div>
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">

          <input type="text" id="search-input" oninput="renderRecords()" placeholder="Buscar repuesto, nota, categoría, taller..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-3 py-2 text-xs sm:text-sm text-white font-bold focus:outline-none focus:border-cyan-500">
        </div>
        <select id="filter-category" onchange="renderRecords()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white font-bold focus:outline-none focus:border-cyan-500">
          <option value="ALL">Todas las Categorías</option>
        </select>
      </div>
      <div id="records-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
    </div>
