<div id="modal-categories" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4">
    <div class="animated-glass-card rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-sm font-black flex items-center space-x-2">
          <i class="fa-solid fa-list text-cyan-400"></i>
          <span>Gestionar Categorías</span>
        </h3>
        <button onclick="closeCategoryModal()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="flex space-x-2">
        <input type="text" id="new-category-input" placeholder="Nueva categoría..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-cyan-500">
        <button type="button" onclick="addNewCategory()" class="px-3 py-2 bg-cyan-600 text-white text-xs font-black rounded-xl">Agregar</button>
      </div>

      <div id="categories-manage-list" class="space-y-2 max-h-48 overflow-y-auto"></div>

      <div class="pt-2 border-t border-slate-700 flex justify-end">
        <button onclick="closeCategoryModal()" class="px-4 py-1.5 bg-cyan-600 text-white rounded-xl text-xs font-black">Aceptar</button>
      </div>
    </div>
  </div>

<div id="modal-form" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="animated-glass-card rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 my-8">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 id="form-modal-title" class="text-sm font-black">Nuevo Mantenimiento</h3>
        <button onclick="closeFormModal()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="record-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="record-id">
        <div>
          <label class="block font-extrabold mb-1">Título del Servicio *</label>
          <input type="text" id="form-title" required placeholder="Ej. Cambio de Aceite" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-bold focus:outline-none focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-extrabold mb-1">Categoría</label>
            <select id="form-category" onchange="onCategoryChange(this)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 font-bold focus:outline-none"></select>
          </div>
          <div>
            <label class="block font-extrabold mb-1">Costo / Monto *</label>
            <div class="flex space-x-1">
              <select id="form-currency" class="bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 font-black focus:outline-none">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="HNL">HNL (L)</option>
                <option value="MXN">MXN ($)</option>
                <option value="GTQ">GTQ (Q)</option>
                <option value="NIO">NIO (C$)</option>
                <option value="CRC">CRC (₡)</option>
                <option value="PAB">PAB (B/.)</option>
                <option value="CAD">CAD ($)</option>
              </select>
              <input type="number" step="0.01" id="form-amount" required placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 font-bold focus:outline-none">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-extrabold mb-1">Lectura Objetivo</label>
            <input type="number" id="form-mileage" placeholder="Ej. 90000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 font-bold focus:outline-none">
          </div>
          <div>
            <label class="block font-extrabold mb-1">Taller / Proveedor</label>
            <input type="text" id="form-provider" placeholder="Ej. Taller Central" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 font-bold focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block font-extrabold mb-1">Fecha *</label>
            <input type="date" id="form-date" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-1.5 py-2 font-bold">
          </div>
          <div>
            <label class="block font-extrabold mb-1">Alarma</label>
            <input type="date" id="form-alert-date" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-1.5 py-2 font-bold">
          </div>
          <div>
            <label class="block font-extrabold mb-1">Hora</label>
            <input type="time" id="form-alert-time" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-1.5 py-2 font-bold">
          </div>
        </div>

        <div>
          <label class="block font-extrabold mb-1">Notas</label>
          <textarea id="form-notes" rows="2" placeholder="Detalles..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 font-bold focus:outline-none"></textarea>
        </div>

        <!-- SECCIÓN DE IMAGEN CON GALERÍA Y OPCIONES -->
        <div class="space-y-1.5">
          <label class="block font-extrabold">Adjuntar Imagen / Comprobante</label>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-extrabold mb-1 opacity-90">📁 Galería del Dispositivo</label>
              <input type="file" id="form-photo-input" accept="image/*" onchange="previewImageFile(event)" class="w-full text-[10px] file:mr-1 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white cursor-pointer font-bold">
            </div>
            <div>
              <label class="block text-[10px] font-extrabold mb-1 opacity-90">☁️ Photos / Drive / URL</label>
              <input type="url" id="form-photo-url" oninput="previewImageUrl(this.value)" placeholder="Pega enlace o URL..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-1.5 text-xs font-bold focus:outline-none">
            </div>
          </div>
          <div id="photo-preview-container" class="mt-2 hidden relative w-20 h-20 rounded-xl overflow-hidden border border-slate-700">
            <img id="photo-preview" src="" class="w-full h-full object-cover">
            <button type="button" onclick="removePhoto()" class="absolute top-0.5 right-0.5 bg-rose-600 text-white rounded-full p-0.5 text-[10px]"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeFormModal()" class="px-3 py-1.5 bg-slate-800 font-extrabold rounded-xl">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 bg-cyan-600 text-white font-black rounded-xl">Guardar</button>
        </div>
      </form>
    </div>
  </div>

<div id="modal-image-viewer" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-[90] hidden flex flex-col items-center justify-center p-4 cursor-pointer" onclick="this.classList.add('hidden')">
    <div class="relative max-w-4xl w-full flex flex-col items-center">
      <img id="image-viewer-src" src="" class="max-h-[85vh] max-w-full rounded-2xl shadow-2xl object-contain border border-slate-700">
    </div>
  </div>
