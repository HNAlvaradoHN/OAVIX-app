<header class="bg-slate-900/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-800/80 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 h-auto min-h-[4.5rem] flex flex-wrap items-center justify-between gap-2 py-2.5">

      <!-- LOGO OAVIX -->
      <div class="flex items-center space-x-2 cursor-pointer shrink-0" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <svg class="h-6 sm:h-8 w-auto text-cyan-400" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 20 50 Q 80 48 110 32 Q 150 15 210 22 Q 250 28 280 42 Q 295 48 305 50 M 50 50 Q 120 40 180 25 Q 230 25 270 42" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M 120 28 Q 160 18 205 24" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 10 52 L 295 52" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
        </svg>
        <div class="flex flex-col">
          <div class="flex items-center space-x-0.5 font-black text-sm sm:text-xl tracking-widest leading-none">
            <span class="text-white dark:text-white">O</span><span class="text-cyan-400 font-extrabold">A</span><span class="text-white dark:text-white">V</span><span class="text-white dark:text-white">I</span><span class="text-cyan-400 font-extrabold">X</span>
          </div>
          <span class="text-[6px] sm:text-[8px] font-bold tracking-wider uppercase text-cyan-400/90 mt-0.5">Vehicle Management</span>
        </div>
      </div>

      <!-- BOTONES SUPERIORES OPTIMIZADOS PARA MÓVIL -->
      <div class="flex flex-wrap items-center gap-1 sm:gap-2 shrink-0">

        <button id="btn-notif-perm" onclick="requestNotificationPermission()" class="p-1.5 sm:px-2 sm:py-1 rounded-xl text-[10px] sm:text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/40 transition flex items-center space-x-1" title="Alertas">
          <i class="fa-solid fa-bell text-xs"></i>
          <span class="hidden md:inline">Alertas</span>
        </button>

        <button onclick="openThemeModal()" class="p-1.5 sm:p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition" title="Personalizar Fondo y Neón">
          <i class="fa-solid fa-palette text-xs text-amber-400"></i>
        </button>

        <button onclick="toggleTheme()" class="p-1.5 sm:p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition" title="Cambiar Tema Día/Noche">
          <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
        </button>
      </div>
    </div>
  </header>
