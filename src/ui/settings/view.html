<div id="oavix-settings-backdrop" class="oavix-settings-backdrop hidden" aria-hidden="true"
  onclick="closeSettingsMenu({ restoreFocus: true })"></div>

<div id="oavix-settings-hub" class="oavix-settings-hub">
  <button id="oavix-settings-toggle" type="button" class="oavix-settings-toggle"
    aria-label="Abrir configuración" aria-haspopup="menu" aria-expanded="false"
    aria-controls="oavix-settings-panel" onclick="toggleSettingsMenu()">
    <i class="fa-solid fa-gear" aria-hidden="true"></i>
    <span class="oavix-settings-toggle-dot" aria-hidden="true"></span>
  </button>

  <div id="oavix-settings-panel" class="oavix-settings-panel hidden" role="dialog"
    aria-labelledby="oavix-settings-title">
    <div class="oavix-settings-heading">
      <div>
        <span class="oavix-settings-kicker">OAVIX</span>
        <h2 id="oavix-settings-title">Centro de control</h2>
      </div>
      <button type="button" class="oavix-settings-close" aria-label="Cerrar configuración"
        onclick="closeSettingsMenu()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <section class="oavix-settings-section" aria-labelledby="settings-account-title">
      <h3 id="settings-account-title">Cuenta</h3>

      <button id="oavix-drive-control" type="button" class="oavix-settings-item">
        <span class="oavix-settings-item-icon oavix-settings-icon-cloud">
          <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
        </span>
        <span class="oavix-settings-item-copy">
          <strong>Sincronizar con Drive</strong>
          <small id="settings-sync-caption">Guardar y descargar lo más reciente</small>
        </span>
        <span id="settings-sync-state" class="oavix-settings-state settings-state-ready">Listo</span>
      </button>

    </section>

    <section class="oavix-settings-section" aria-labelledby="settings-appearance-title">
      <h3 id="settings-appearance-title">Apariencia</h3>

      <div class="oavix-settings-grid">
        <button id="settings-customize" type="button" class="oavix-settings-item oavix-settings-item-compact"
          onclick="openSettingsThemeEditor()">
          <span class="oavix-settings-item-icon oavix-settings-icon-palette">
            <i class="fa-solid fa-palette" aria-hidden="true"></i>
          </span>
          <span class="oavix-settings-item-copy">
            <strong>Personalizar</strong>
            <small>Fondo y color neón</small>
          </span>
        </button>

        <button id="settings-theme-toggle" type="button" class="oavix-settings-item oavix-settings-item-compact"
          onclick="toggleSettingsTheme()">
          <span class="oavix-settings-item-icon oavix-settings-icon-theme">
            <i id="theme-icon" class="fa-solid fa-moon" aria-hidden="true"></i>
          </span>
          <span class="oavix-settings-item-copy">
            <strong id="settings-theme-label">Modo noche</strong>
            <small id="settings-theme-caption">Cambiar a modo día</small>
          </span>
        </button>
      </div>
    </section>

    <section class="oavix-settings-section" aria-labelledby="settings-export-title">
      <h3 id="settings-export-title">Exportar información</h3>

      <div class="oavix-settings-grid">
        <button id="settings-export-excel" type="button"
          class="oavix-settings-item oavix-settings-item-compact settings-export-excel"
          onclick="openOavixExportPicker('excel')">
          <span class="oavix-settings-item-icon"><i class="fa-solid fa-file-excel" aria-hidden="true"></i></span>
          <span class="oavix-settings-item-copy">
            <strong>Excel</strong>
            <small>Libro con todos los datos</small>
          </span>
        </button>

        <button id="settings-export-pdf" type="button"
          class="oavix-settings-item oavix-settings-item-compact settings-export-pdf"
          onclick="openOavixExportPicker('pdf')">
          <span class="oavix-settings-item-icon"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></span>
          <span class="oavix-settings-item-copy">
            <strong>PDF</strong>
            <small>Informe listo para guardar</small>
          </span>
        </button>
      </div>
    </section>

    <p class="oavix-settings-footnote">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      Tus datos privados permanecen vinculados a tu cuenta.
    </p>
  </div>
</div>

<div id="oavix-export-picker" class="oavix-export-picker hidden" role="dialog" aria-modal="true"
  aria-labelledby="oavix-export-picker-title">
  <div class="oavix-export-picker-backdrop" onclick="closeOavixExportPicker()"></div>
  <section class="oavix-export-picker-card">
    <header class="oavix-export-picker-heading">
      <div>
        <span class="oavix-settings-kicker">EXPORTAR</span>
        <h2 id="oavix-export-picker-title">Elegir mantenimientos</h2>
        <p id="oavix-export-picker-caption">Selecciona los registros que deseas incluir.</p>
      </div>
      <button type="button" class="oavix-settings-close" aria-label="Cerrar selector" onclick="closeOavixExportPicker()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>
    <div class="oavix-export-picker-actions">
      <button type="button" onclick="setAllOavixExportMaintenance(true)">Seleccionar todos</button>
      <button type="button" onclick="setAllOavixExportMaintenance(false)">Limpiar</button>
      <strong id="oavix-export-picker-count">0 seleccionados</strong>
    </div>
    <div id="oavix-export-maintenance-list" class="oavix-export-maintenance-list"></div>
    <footer class="oavix-export-picker-footer">
      <button type="button" class="oavix-export-cancel" onclick="closeOavixExportPicker()">Cancelar</button>
      <button id="oavix-export-confirm" type="button" class="oavix-export-confirm" onclick="confirmOavixExport()">Exportar seleccionados</button>
    </footer>
  </section>
</div>
