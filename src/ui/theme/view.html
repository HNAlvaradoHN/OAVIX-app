<div id="modal-theme" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4">
    <div class="animated-glass-card rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2">
        <h3 class="text-sm font-black flex items-center space-x-2">
          <i class="fa-solid fa-palette text-amber-400"></i>
          <span>Personalizar Fondo y Neón</span>
        </h3>
        <button onclick="closeThemeModal()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3 text-xs font-bold">
        <div>
          <label class="block font-extrabold mb-1">Color de Fondo Dinámico (Único)</label>
          <input type="color" id="picker-bg-color" value="#030712" onchange="applyCustomTheme()" class="w-full h-8 bg-transparent cursor-pointer rounded border border-slate-600">
        </div>
        <div>
          <label class="block font-extrabold mb-1">Color de Neón / Bordes Animados</label>
          <input type="color" id="picker-border-color" value="#06b6d4" onchange="applyCustomTheme()" class="w-full h-8 bg-transparent cursor-pointer rounded border border-slate-600">
        </div>
      </div>

      <div class="pt-3 border-t border-slate-700 flex items-center justify-between">
        <button onclick="resetDefaultTheme()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-xl text-xs font-black">Restablecer Tema</button>
        <button onclick="closeThemeModal()" class="px-4 py-1.5 bg-cyan-600 text-white rounded-xl font-black">Aceptar</button>
      </div>
    </div>
  </div>
